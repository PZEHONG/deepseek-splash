<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>DeepSeek Harness</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05060e}
    body{color:#f3f4ff;font-family:"Segoe UI","Microsoft YaHei",sans-serif;transition:opacity .24s ease}
    .scene{position:absolute;inset:0}video{width:100%;height:100%;object-fit:cover;display:block}
    .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,6,19,.87),rgba(4,6,19,.18) 31%,transparent 53%);pointer-events:none}
    .brand{position:absolute;left:5%;bottom:9.3%;animation:reveal .9s .24s both;pointer-events:none}
    .eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:10px;letter-spacing:3px;color:#c2caff;text-transform:uppercase}
    .mark{width:16px;height:2px;background:linear-gradient(90deg,#82afff,#e9c9ff);box-shadow:0 0 10px #91a9ff}
    h1{font-size:clamp(24px,3.6vw,39px);line-height:1.15;letter-spacing:-.7px;font-weight:600;margin:0;text-shadow:0 2px 20px #070a20}
    .status{display:flex;align-items:center;gap:9px;margin-top:15px;font-size:12px;letter-spacing:1.5px;color:#b9bfd8}
    .dot{width:5px;height:5px;flex-shrink:0;border-radius:50%;background:#aabaff;box-shadow:0 0 8px #849dff;animation:breathe 1.6s infinite}
    .skip{position:absolute;right:5%;bottom:9.7%;padding:7px 0 7px 16px;border:0;background:transparent;color:#c1c6da;font:11px "Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:.7px;cursor:pointer;opacity:.65;animation:reveal 1s 1.4s both}
    .skip:hover,.skip:focus-visible{opacity:1;color:#fff;outline:0}.skip span{display:inline-block;border:1px solid #ffffff36;border-radius:4px;font-size:9px;padding:3px 5px;margin-left:6px}
    .track{position:absolute;bottom:0;left:0;right:0;height:2px;background:#819dff18}
    .progress{height:100%;width:35%;background:linear-gradient(90deg,transparent,#7395f6,#ccc0ff,transparent);box-shadow:0 0 9px #9badff;animation:loading 1.5s ease-in-out infinite}
    @keyframes loading{from{transform:translateX(-100%)}to{transform:translateX(286%)}}
    @keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes breathe{50%{opacity:.3}}
    @media(prefers-reduced-motion:reduce){.brand,.skip,.dot{animation:none}}
  </style>
</head>
<body>
  <div class="scene"><video autoplay muted playsinline preload="auto" poster="harness-poster.jpg"><source src="harness-splash.webm" type="video/webm"></video></div>
  <div class="shade"></div>
  <div class="brand"><div class="eyebrow"><i class="mark"></i>DEEPSEEK</div><h1>DeepSeek Harness</h1><div class="status"><i class="dot"></i><span id="status">正在启动</span></div></div>
  <button class="skip" aria-label="跳过开屏动画">跳过 <span>Esc</span></button>
  <div class="track"><div class="progress"></div></div>
  <script>
    const video=document.querySelector('video');
    window.__harnessSplashSkipRequested=false;
    function skip(){window.__harnessSplashSkipRequested=true;}
    document.querySelector('.skip').addEventListener('click',skip);
    addEventListener('keydown',event=>{if(event.key==='Escape')skip();});
    // If startup is slower than the clip, its last frame covers the remaining load.
    video.play().catch(()=>{});
  </script>
</body>
</html>
